[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
use_literal_content = true # store source code in the json file directly
via_ir = false # fast compilation for local dev

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 50 }

[profile.production]
via_ir = true
optimizer_runs = 1000000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[fuzz]
runs = 256
seed = '0x1'

[invariant]
runs = 50
depth = 20
fail_on_revert = false

[rpc_endpoints]
base = "${BASE_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
monad = "${MONAD_RPC_URL}"

[etherscan]
base = { key = "${BASESCAN_API_KEY}"}
polygon = { key = "${POLYGONSCAN_API_KEY}" }