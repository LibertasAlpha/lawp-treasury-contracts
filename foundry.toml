[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
use_literal_content = true # store source code in the json file directly

[fuzz]
runs = 256
seed = '0x1'

[invariant]
runs = 128
depth = 20
fail_on_revert = false

[rpc_endpoints]
base = "${BASE_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
monad = "${MONAD_RPC_URL}"

[etherscan]
base = { key = "${BASESCAN_API_KEY}"}
polygon = { key = "${POLYGONSCAN_API_KEY}" }